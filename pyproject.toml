[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalealign-detr-repo"
version = "0.1.0"
description = "Reproducible adapters for ScaleAlign DETR implementations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
